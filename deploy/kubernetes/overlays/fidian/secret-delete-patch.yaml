# Keep upstream's placeholder Secret out of this overlay. The live
# omnigent-secrets holds the real DATABASE_URL, OMNIGENT_ACCOUNTS_COOKIE_SECRET,
# POSTGRES_PASSWORD and OMNIGENT_OIDC_CLIENT_SECRET, managed by hand; applying
# base's placeholders would break the database connection and sign everyone
# out. Pods and the migration Job still reference omnigent-secrets by name.
$patch: delete
apiVersion: v1
kind: Secret
metadata:
  name: omnigent-secrets
