apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Fidian's GKE deployment (cluster fidian-omnigent-small, project fidian-dev-1).
#
# Everything specific to this cluster lives in this directory, so `base/` and
# `overlays/postgres/` stay byte-identical to upstream and rebasing onto the
# next release tag can't conflict here.
#
# Deploy with: omnigent-install.sh --overlay fidian

namespace: omnigent

resources:
  - ../postgres
  - sandbox-config.yaml

patches:
  - path: deployment-patch.yaml
  - path: postgres-patch.yaml
  - path: config-patch.yaml

# db-upgrade-job.yaml is deliberately absent: a migration Job belongs to one
# upgrade, not to every apply. See the comments in that file.
